<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Log Master v1.2 icon: original line-art horizontal scroll, teal on black. Empty interior. -->
  <rect width="512" height="512" rx="96" fill="#000"/>
  <g fill="none" stroke="#00b3a4" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- parchment body -->
    <rect x="76" y="126" width="360" height="260" rx="32"/>
    <!-- inset rollers inside the body -->
    <line x1="156" y1="126" x2="156" y2="386"/>
    <line x1="356" y1="126" x2="356" y2="386"/>
    <!-- roller stems in the side gutters, taller than the body -->
    <line x1="126" y1="71" x2="126" y2="126"/>
    <line x1="126" y1="386" x2="126" y2="441"/>
    <line x1="386" y1="71" x2="386" y2="126"/>
    <line x1="386" y1="386" x2="386" y2="441"/>
    <!-- small knob / cap ends -->
    <line x1="110" y1="71" x2="142" y2="71"/>
    <line x1="110" y1="441" x2="142" y2="441"/>
    <line x1="370" y1="71" x2="402" y2="71"/>
    <line x1="370" y1="441" x2="402" y2="441"/>
    <!-- shoulders where the rollers meet the parchment -->
    <line x1="96" y1="126" x2="156" y2="126"/>
    <line x1="96" y1="386" x2="156" y2="386"/>
    <line x1="356" y1="126" x2="416" y2="126"/>
    <line x1="356" y1="386" x2="416" y2="386"/>
  </g>
</svg>
